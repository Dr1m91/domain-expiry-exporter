replicaCount: 1

image:
  repository: ghcr.io/dr1m91/domain-expiry-exporter
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

exporter:
  port: 9222
  scanInterval: "1m"
  staleAfter: "24h"
  concurrency: 20

# Optional static list of domains to seed at startup.
# Leave empty to rely entirely on Prometheus /probe scrapes for domain discovery.
domains: []

# Vanilla Prometheus Operator discovery (disabled by default)
serviceMonitor:
  enabled: false
  interval: 1m
  labels: {}

# VictoriaMetrics Operator discovery (disabled by default)
vmServiceScrape:
  enabled: false
  interval: 1m
  labels: {}

redis:
  enabled: false
  host: ""
  port: 6379
  username: ""
  passwordSecret:
    name: ""
    key: password
  key: domain-expiry-exporter:entries
  persistInterval: 10s

valkey:
  enabled: false
  fullnameOverride: ""
  auth:
    enabled: true
    usersExistingSecret: ""
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: password
  deploymentStrategy: Recreate
  readinessProbe:
    enabled: true
  dataStorage:
    enabled: true
    requestedSize: 1Gi
  valkeyConfig: |
    maxmemory 64mb
    maxmemory-policy volatile-lru
    save 60 1
    appendonly no
